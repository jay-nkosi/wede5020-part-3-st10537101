<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="contact.css">
    <title>Contact Us | Jay Monate Auto SA</title>
    <meta name="description" content="Contact Jay Monate Auto SA. Find our head office in Johannesburg CBD">
   
</head>
<body>

    <!-- ==================== HEADER & NAVIGATION ==================== -->
    <header>
        <div class="logo">
            <h1>Jay Monate Auto SA</h1>
        </div>

        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Programmes</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>

        <!-- Page heading -->
        <section class="page-intro">
            <h2>Contact Us</h2>
            <p>We'd love to hear from you. Reach out using the details below or send us a message.</p>
        </section>

        <!-- Location cards: head office plus two event venues (more than 1 location, as required) -->
        <section class="locations">

            <div class="location-card">
                <h3>Head Office &mdash; Johannesburg</h3>
                <address>
                    45 Roman<br>
                    </br>Johannesburg, 2001
                </address>
                <p>Tel: 011 555 0199</p>
                <p>Email: sales@jaymonateautosa.co.za</p>
            </div>

            

        </section>

        <!-- Embedded map -->
        <section class="map-section">
            <h3>Find Us</h3>
            <iframe
                src=""
                width="100%"
                height="400"
                style="border:0;"
                allowfullscreen=""
                loading="lazy"
                title="Map showing Jay Monate Auto SA head office in Johannesburg>
            </iframe>
        </section>

        <!-- Contact form -->
        <section class="contact-form-section">
            <h3>Send Us a Message</h3>
            <form action="#" method="post" id="contact-form">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer>
        <p>&copy; 2026 Jay Monate Auto SA All rights reserved.</p>
        <p>Soweto, Johannesburg | info@crownofhope.org.za</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
